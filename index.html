<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử Thách Mật Mã</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #fdf2f8; 
            color: #333;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #db2777; margin-bottom: 10px; }
        .header p { color: #6b7280; font-size: 16px; }

        .controls {
            background: #fff; padding: 20px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 20px; text-align: center; width: 100%; max-width: 400px;
        }

        .btn {
            background: #db2777; color: #fff; border: none;
            padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 18px;
            cursor: pointer; width: 100%; transition: 0.2s;
            animation: pulse 2s infinite;
        }
        .btn:hover { background: #be185d; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* BÀN CHƠI XẾP HÌNH */
        #puzzle-board {
            width: 300px; height: 300px;
            background: #e5e7eb; border: 4px solid #db2777; border-radius: 8px;
            position: relative; overflow: hidden;
            box-shadow: 0 15px 30px rgba(219, 39, 119, 0.2);
            /* Đã bỏ thuộc tính display: none để bảng hiện ra ngay */
        }

        .tile {
            width: 100px; height: 100px;
            position: absolute;
            background-size: 300px 300px;
            border: 1px solid #fff;
            transition: transform 0.2s ease-in-out;
            cursor: pointer;
        }

        #win-message {
            display: none; margin-top: 20px; color: #10b981;
            font-size: 24px; font-weight: bold; text-align: center;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Bức Ảnh Bí Mật 💖</h1>
        <p>Phải xếp xong mới cho biết là ảnh gì nhé!</p>
    </div>

    <div class="controls">
        <button id="startBtn" class="btn">BẤM VÀO ĐÂY ĐỂ TRỘN ẢNH!</button>
    </div>

    <div id="puzzle-board"></div>
    <div id="win-message">Xếp xong rồi à? Giỏi đấy, duyệt! 😘</div>

        // ==========================================

        const startBtn = document.getElementById('startBtn');
        const board = document.getElementById('puzzle-board');
        const winMessage = document.getElementById('win-message');

        const SIZE = 3; 
        const TILE_SIZE = 100; 
        let tiles = [];
        let emptyPos = { x: 2, y: 2 }; 
        let isPlaying = false;

        // Tự động load bảng ngay khi mở web
        window.onload = function() {
            initBoard();
        };

        function initBoard() {
            board.innerHTML = '';
            tiles = [];
            
            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    if (x === SIZE - 1 && y === SIZE - 1) {
                        emptyPos = { x, y };
                        continue;
                    }

                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.style.backgroundImage = `url('${imageUrl}')`;
                    tile.style.backgroundPosition = `-${x * TILE_SIZE}px -${y * TILE_SIZE}px`;
                    
                    const tileObj = { 
                        element: tile, 
                        currentX: x, currentY: y, 
                        correctX: x, correctY: y 
                    };
                    
                    updateTilePosition(tileObj);
                    tile.addEventListener('click', () => moveTile(tileObj));
                    
                    board.appendChild(tile);
                    tiles.push(tileObj);
                }
            }
        }

        function updateTilePosition(tileObj) {
            tileObj.element.style.transform = `translate(${tileObj.currentX * TILE_SIZE}px, ${tileObj.currentY * TILE_SIZE}px)`;
        }

        function moveTile(tileObj) {
            if (!isPlaying) return;

            const isAdjacent = (Math.abs(tileObj.currentX - emptyPos.x) === 1 && tileObj.currentY === emptyPos.y) ||
                               (Math.abs(tileObj.currentY - emptyPos.y) === 1 && tileObj.currentX === emptyPos.x);

            if (isAdjacent) {
                const tempX = tileObj.currentX;
                const tempY = tileObj.currentY;
                
                tileObj.currentX = emptyPos.x;
                tileObj.currentY = emptyPos.y;
                
                emptyPos.x = tempX;
                emptyPos.y = tempY;

                updateTilePosition(tileObj);
                checkWin();
            }
        }

        // Logic Xáo trộn ảnh
        startBtn.addEventListener('click', () => {
            isPlaying = true;
            winMessage.style.display = 'none';
            startBtn.innerText = 'Đang xáo trộn...';
            startBtn.disabled = true;
            
            let shuffleCount = 0;
            const shuffleInterval = setInterval(() => {
                const movableTiles = tiles.filter(t => 
                    (Math.abs(t.currentX - emptyPos.x) === 1 && t.currentY === emptyPos.y) ||
                    (Math.abs(t.currentY - emptyPos.y) === 1 && t.currentX === emptyPos.x)
                );
                
                const randomTile = movableTiles[Math.floor(Math.random() * movableTiles.length)];
                
                const tempX = randomTile.currentX;
                const tempY = randomTile.currentY;
                randomTile.currentX = emptyPos.x;
                randomTile.currentY = emptyPos.y;
                emptyPos.x = tempX;
                emptyPos.y = tempY;
                
                updateTilePosition(randomTile);

                shuffleCount++;
                if (shuffleCount >= 100) {
                    clearInterval(shuffleInterval);
                    startBtn.innerText = 'Đã trộn xong! Xếp đi nào 😘';
                }
            }, 10); 
        });

        function checkWin() {
            const isWin = tiles.every(t => t.currentX === t.correctX && t.currentY === t.correctY);
            if (isWin) {
                isPlaying = false;
                setTimeout(() => {
                    winMessage.style.display = 'block';
                    board.style.border = '4px solid #10b981';
                    startBtn.innerText = 'CHƠI LẠI';
                    startBtn.disabled = false;
                }, 300);
            }
        }
    </script>
